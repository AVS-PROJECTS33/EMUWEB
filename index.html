    <!-- Script para renderizar icono en iOS al vuelo (Solución al bug de SVG de Apple) -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const canvas = document.createElement("canvas");
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext("2d");
            const img = new Image();
            img.onload = function() {
                ctx.drawImage(img, 0, 0);
                const pngData = canvas.toDataURL("image/png");
                let link = document.querySelector('link[rel="apple-touch-icon"]');
                if (!link) {
                    link = document.createElement('link');
                    link.rel = 'apple-touch-icon';
                    document.head.appendChild(link);
                }
                link.href = pngData; // Sustituye el SVG por un PNG compatible con iPhone
            };
            img.src = document.querySelector('link[rel="apple-touch-icon"]').href;
        });
    </script>

    <style>
        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100dvh; /* dvh corrige el scroll en móviles */
            background-color: #111; color: white; font-family: sans-serif;
            overflow: hidden;
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://raw.githubusercontent.com/AVS-PROJECTS33/EMUWEB/main/Gemini_Generated_Image_6qtlzm6qtlzm6qtl.png');

        /* Menú Principal */
        #menu-screen {
            display: flex; flex-direction: column; align-items: center;

            background: transparent; border: none; color: #888;

        .console-section.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .console-title { 
            font-size: 15px; border-bottom: 2px solid #333;

<body>

    <!-- PANTALLA DE MENÚ -->
    <div id="menu-screen">
        
        <h1>🎮 Retro Web Emu</h1>

        <!-- Buscador -->
        <input type="text" id="search-input" placeholder="🔍 Buscar juego..." onkeyup="filterGames()">

        <!-- Pestañas de Navegación -->
        <div class="tabs-container">
            <button class="tab-btn active" onclick="switchTab('snes', this)">🕹️ SNES</button>
            <button class="tab-btn" onclick="switchTab('fav', this)">⭐ Favs</button>
            <button class="tab-btn" onclick="switchTab('md', this)">🌀 Mega Drive</button>
            <button class="tab-btn" onclick="switchTab('gba', this)">📱 GB / Advance</button>
            <button class="tab-btn" onclick="switchTab('psx', this)">💿 PS1</button>
            <button class="tab-btn" onclick="switchTab('nes', this)">🕹️ NES</button>
            <button class="tab-btn" onclick="switchTab('ds', this)">🎮 NDS</button>
            <button class="tab-btn" onclick="switchTab('n64', this)">🔱 N64</button>
            <button class="tab-btn" onclick="switchTab('local', this)">📁 Local</button>
        </div>

        <!-- Secciones -->
        <div id="tab-snes" class="console-section active">
            <div class="console-title" style="color:#4caf50;">Super Nintendo</div>
            <div id="snes-auto-list"></div>
        </div>

        <div id="tab-fav" class="console-section">
            <div class="console-title" style="color:#ffeb3b;">Mis Favoritos</div>
            <div id="fav-auto-list"></div>
        </div>

        <div id="tab-md" class="console-section">
            <div class="console-title" style="color:#2196f3;">Sega Genesis</div>
            <div id="md-auto-list"></div>
        </div>

        <div id="tab-gba" class="console-section">
            <div class="console-title" style="color:#9c27b0;">Game Boy / Advance</div>
            <div id="gba-auto-list"></div>
        </div>

        <div id="tab-psx" class="console-section">
            <div class="console-title" style="color:#e0e0e0;">PlayStation 1 (PSX)</div>
            <div id="psx-auto-list"></div>
        </div>

        <div id="tab-nes" class="console-section">
            <div class="console-title" style="color:#f44336;">Nintendo (NES)</div>
            <div id="nes-auto-list"></div>
        </div>

        <div id="tab-ds" class="console-section">
            <div class="console-title" style="color:#3b82f6;">Nintendo DS</div>
            <div id="ds-auto-list"></div>
        </div>

        <div id="tab-n64" class="console-section">
            <div class="console-title" style="color:#ffcc00;">Nintendo 64</div>
            <div id="n64-auto-list"></div>
        </div>

        <div id="tab-local" class="console-section">
            <div class="console-title" style="color:#ff9800;">Carga Manual</div>
            <input type="file" id="rom-upload" accept=".smc,.sfc,.md,.gen,.bin,.gb,.gbc,.gba,.iso,.cue,.chd,.pbp,.nes,.nds,.n64,.v64,.z64" multiple style="display: none;" onchange="loadLocalRoms(event)">
            <button class="game-btn" onclick="openLocalRoms()" style="background: #ff9800; text-align: center; font-weight: bold; border-color: #ff9800;">📁 Seleccionar ROMs de tu PC/Móvil</button>
            <div id="local-roms-list"></div>
        </div>
    </div>

    <!-- PANTALLA DE JUEGO -->
    <div id="game-screen">
        <div id="game-container"></div>
        
        <!-- Botón flotante independiente (Discreto, arriba a la izquierda) -->
        <button onclick="openOptionsMenu()" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.5'" style="position: absolute; top: 15px; left: 15px; background: rgba(0, 0, 0, 0.4); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); width: 42px; height: 42px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 9997; backdrop-filter: blur(3px); font-size: 20px; padding: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.3); opacity: 0.5; transition: opacity 0.3s;">
            ⚙️
        </button>
    </div>

    <!-- MENÚ DE OPCIONES DE PARTIDA -->
    <div id="options-menu-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 9998;">
        <div class="slot-menu-content" style="display: flex; flex-direction: column; gap: 10px; padding: 18px;">
            <h2 style="color: #ffeb3b; margin-top: 0; margin-bottom: 5px;">Herramientas</h2>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <button class="game-btn" onclick="closeOptionsMenu(); openSlotMenu('save')" style="background: #1565c0; text-align: center; margin-bottom: 0; padding: 12px 5px; font-size: 13px;">💾 Guardar</button>
                <button class="game-btn" onclick="closeOptionsMenu(); openSlotMenu('load')" style="background: #2e7d32; text-align: center; margin-bottom: 0; padding: 12px 5px; font-size: 13px;">📂 Cargar</button>
            </div>
            
            <button class="game-btn" id="btn-touch-toggle" onclick="toggleTouchControls()" style="background: #607d8b; text-align: center; margin-bottom: 0; padding: 12px; font-size: 14px; width: 100%;">📱 Ocultar Mando Táctil</button>

            <div style="height: 1px; background: #444; margin: 4px 0;"></div>
            
            <div style="display: flex; align-items: center; gap: 10px; background: #2a2a2a; padding: 10px 15px; border-radius: 8px; border: 1px solid #555;">
                <button id="mute-btn" onclick="toggleMute()" style="background: transparent; border: none; font-size: 22px; cursor: pointer; color: white; padding: 0; width: 30px;">🔊</button>
                <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1" oninput="changeVolume(this.value)" style="flex: 1; cursor: pointer;">
            </div>

            <div style="height: 1px; background: #444; margin: 4px 0;"></div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <button class="game-btn" onclick="restartGameAction()" style="background: #e65100; text-align: center; margin-bottom: 0; padding: 12px 5px; font-size: 13px;">🔄 Reiniciar juego</button>
                <button class="game-btn" onclick="confirmExit()" style="background: #d32f2f; text-align: center; margin-bottom: 0; padding: 12px 5px; font-size: 13px;">❌ Salir juego</button>
            </div>
            
            <button onclick="closeOptionsMenu()" style="background: #f44336; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 5px;">Cerrar Menú</button>
        </div>
    </div>

    <!-- MENÚ DE SLOTS DE GUARDADO -->
    <div id="slot-menu-overlay">
        <div class="slot-menu-content">
            <h2 id="slot-menu-title">Guardar Partida</h2>
            <div id="slot-grid-container">
                <!-- Los slots se generan aquí con JS -->
            </div>
            <button id="slot-menu-close" onclick="closeSlotMenu()">Cancelar</button>
        </div>
    </div>

    <script>
        // Función para filtrar juegos en el buscador
        function filterGames() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            // Selecciona todos los wrappers de juego y botones sueltos de Local
            const items = document.querySelectorAll('.game-wrapper, #local-roms-list .game-btn');
            
            items.forEach(item => {
                const text = item.innerText.toLowerCase();
                const isFlex = item.classList.contains('game-wrapper');
                item.style.display = text.includes(searchTerm) ? (isFlex ? 'flex' : 'block') : 'none';
            });
        }

        // Función para cambiar entre pestañas
        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.console-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            btnElement.classList.add('active');
        }
        
        function startGame(core, romUrl, gameId) {
            // Ocultar menú y mostrar juego
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';

            // Identificador seguro para el sistema de guardado
            window.AVS_GAME_ID = gameId || romUrl.split('/').pop() || 'unknown_game';
            
            // Configuraciones añadidas
            window.EJS_startOnLoaded = true; // Iniciar automáticamente sin pantalla previa
            window.EJS_language = "es"; // Idioma en español

            // Desactivamos el botón de cámara rápida y utilidades de UI que ensucian la pantalla táctil
            window.EJS_Buttons = { fastForward: false };

            // Inyectar el script del emulador dinámicamente para que inicie
            window.EJS_player = '#game-container';
            window.EJS_core = core;
            window.EJS_gameUrl = romUrl;
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            var script = document.createElement('script');
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            script.onerror = function() {
                alert("⚠️ Error: El navegador bloqueó la carga del emulador.\n\nMotivos comunes:\n1. Tienes un bloqueador de anuncios (Brave, AdBlock).\n2. Estás en Modo Incógnito (Especialmente en Safari/iPhone).\n3. Problemas de conexión.\n\nPor favor, revisa esto y vuelve a intentarlo.");
                window.location.reload();
            };
            document.body.appendChild(script);

            // Modificar el DOM del emulador (Iframe) una vez cargado para traducir y corregir botones
            let ejsInterval = setInterval(() => {
                // 1. Fallback súper infalible: Cuando EmulatorJS se cierra, elimina el iframe y pone el texto "exited" en el contenedor de nuestra página.
                const container = document.getElementById('game-container');
                if (container && container.innerText && container.innerText.toLowerCase().includes('exited')) {
                    clearInterval(ejsInterval);
                    window.location.reload();
                    return;
                }

                try {
                    const iframe = document.querySelector('#game-container iframe');
                    if (iframe && iframe.contentWindow && iframe.contentWindow.document) {
                        const doc = iframe.contentWindow.document;

                        // 2. Evitar que el menú (las 3 rayas o barra inferior) se cierre solo
                        if (!doc.getElementById('avs-custom-css')) {
                            const style = doc.createElement('style');
                            style.id = 'avs-custom-css';
                            style.innerHTML = `
                                /* Mantener SOLO la barra inferior negra siempre visible */
                                #bar, .bar {
                                    opacity: 1 !important;
                                    visibility: visible !important;
                                }
                                
                                /* Ocultar el botón de menú táctil flotante (entre los 4 botones) para evitar toques accidentales */
                                /* .menu-button, #menu-btn, div[id*="touch"][id*="menu"], div[class*="touch"][class*="menu"] { */
                                /*     display: none !important; */
                                /*     pointer-events: none !important; */
                                /* } */

                                /* Asegurar que los botones dentro de la barra inferior negra sí funcionen */
                                #bar .menu-button, #bar #menu-btn, .bar .menu-button, .bar #menu-btn {
                                    display: inline-block !important;
                                    pointer-events: auto !important;
                                }
                            `;
                            doc.head.appendChild(style);
                        }

                        // 3. Traducir menú y arreglar el botón de salida
                        const translations = {
                            'Save State': 'Guardar Partida',
                            'Load State': 'Cargar Partida',
                            'Restart': 'Reiniciar',
                            'Mute': 'Silenciar',
                            'Unmute': 'Quitar Silencio',
                            'Enter Fullscreen': 'Pantalla Completa',
                            'Exit Fullscreen': 'Salir de Pantalla Completa',
                            'Settings': 'Ajustes',
                            'Controls': 'Controles',
                            'Control Settings': 'Controles',
                            'Cheats': 'Trucos',
                            'Netplay': 'Juego en Red',
                            'Exit emulation': 'Cerrar juego',
                            'Exit Emulation': 'Cerrar juego',
                            'Salir de la emulación': 'Cerrar juego',
                            'Salir': 'Cerrar juego',
                            'Save State': 'Guardar Partida',
                            'Load State': 'Cargar Partida'
                        };

                        const elements = doc.querySelectorAll('*:not(style):not(script)');
                        for (const el of elements) {
                            const text = el.textContent.trim();
                            const isSaveButton = text === 'Save State' || text === 'Guardar Partida';
                            const isLoadButton = text === 'Load State' || text === 'Cargar Partida';

                            if (isSaveButton || isLoadButton) {
                                const parentBtn = el.closest('div[role="button"], button') || el.parentElement;
                                if (parentBtn && !parentBtn.dataset.hooked) {
                                    parentBtn.dataset.hooked = "true";
                                    const action = isSaveButton ? 'save' : 'load';
                                    const openMenu = (e) => {
                                        e.preventDefault(); 
                                        e.stopPropagation();
                                        e.stopImmediatePropagation(); // Bloquea totalmente al emulador
                                        if (e.type === 'click' || e.type === 'touchend') {
                                            setTimeout(() => window.parent.openSlotMenu(action), 10);
                                        }
                                    };
                                    ['mousedown', 'mouseup', 'click', 'touchstart', 'touchend', 'pointerdown', 'pointerup'].forEach(evt => {
                                        parentBtn.addEventListener(evt, openMenu, true); // true = fase de captura (gana prioridad)
                                    });
                                }
                            }

                            if (el.childNodes.length === 1 && el.childNodes[0].nodeType === 3 && el.textContent.trim() !== '') {
                                const originalText = el.textContent.trim();
                                if (translations[originalText]) {
                                    el.textContent = translations[originalText];

                                    // Si es el botón de salir, necesitamos reemplazarlo para arreglar el cuelgue
                                    const isExitButton = ['Exit emulation', 'Exit Emulation', 'Salir de la emulación', 'Salir'].includes(originalText);
                                    
                                    if (isExitButton) {
                                        // Asegurarnos de usar el contenedor real del botón
                                        const parentBtn = el.closest('div[role="button"], button') || el.parentElement;
                                        if (parentBtn && !parentBtn.dataset.hooked) {
                                            parentBtn.dataset.hooked = "true";
                                            
                                            const forceExit = (e) => {
                                                e.preventDefault();
                                                e.stopPropagation();
                                                e.stopImmediatePropagation();
                                                if (e.type === 'click' || e.type === 'touchend') {
                                                    window.parent.confirmExit();
                                                }
                                            };
                                            
                                            ['mousedown', 'mouseup', 'click', 'touchstart', 'touchend', 'pointerdown', 'pointerup'].forEach(evt => {
                                                parentBtn.addEventListener(evt, forceExit, true);
                                            });
                                        }
                                    }
                                }
                            }
                        }
                    }
                } catch (err) {
                    // Ignorar errores de cross-origin que ocurren mientras el iframe carga
                }
            }, 800); // Reducimos el intervalo para que la traducción sea más rápida
        }

        // =========================================================
        // OPCIÓN 1: CARGAR DESDE UN CATÁLOGO JSON EN CLOUDFLARE R2
        // =========================================================
        const CATALOG_URL = "https://pub-7932d82ab8e64160a8ad206f72cc67ed.r2.dev/catalogo.json";
        const R2_BASE_URL = "https://pub-7932d82ab8e64160a8ad206f72cc67ed.r2.dev";
        window.globalCatalog = [];

        function getFavorites() {
            return JSON.parse(localStorage.getItem('avs_favorites') || '[]');
        }

        function toggleFavorite(fileName) {
            let favs = getFavorites();
            if (favs.includes(fileName)) {
                favs = favs.filter(f => f !== fileName);
            } else {
                favs.push(fileName);
            }
            localStorage.setItem('avs_favorites', JSON.stringify(favs));
            renderAllGames(); 
            filterGames(); 
        }

        function createGameButton(core, fileName, displayName, containerId, isFav) {
            const list = document.getElementById(containerId);
            
            const wrapper = document.createElement('div');
            wrapper.className = 'game-wrapper';
            wrapper.style.display = 'flex';
            wrapper.style.gap = '8px';
            wrapper.style.marginBottom = '12px';

            const btn = document.createElement('button');
            btn.className = 'game-btn';
            btn.style.backgroundColor = '#1565c0'; 
            btn.style.margin = '0';
            btn.style.flex = '1';
            btn.innerText = '🎮 ' + displayName;
            
            // Utilizamos encodeURIComponent para que no fallen los juegos con &, +, # o corchetes en el nombre
            const fileUrl = `${R2_BASE_URL}/${fileName.split('/').map(encodeURIComponent).join('/')}`;
            btn.onclick = () => startGame(core, fileUrl, fileName);

            // Botón de Favorito
            const favBtn = document.createElement('button');
            favBtn.innerHTML = isFav ? '⭐' : '☆';
            favBtn.style.backgroundColor = isFav ? '#4a4a4a' : '#2a2a2a';
            favBtn.style.border = '1px solid #444';
            favBtn.style.color = isFav ? '#ffeb3b' : '#888';
            favBtn.style.borderRadius = '8px';
            favBtn.style.padding = '0 15px';
            favBtn.style.fontSize = '20px';
            favBtn.style.cursor = 'pointer';
            favBtn.onclick = () => toggleFavorite(fileName);

            wrapper.appendChild(btn);
            wrapper.appendChild(favBtn);
            list.appendChild(wrapper);
        }

        function renderAllGames() {
            // Limpiamos las listas para evitar duplicados
            document.getElementById('snes-auto-list').innerHTML = '';
            document.getElementById('md-auto-list').innerHTML = '';
            document.getElementById('gba-auto-list').innerHTML = '';
            document.getElementById('psx-auto-list').innerHTML = '';
            document.getElementById('nes-auto-list').innerHTML = '';
            document.getElementById('ds-auto-list').innerHTML = '';
            document.getElementById('n64-auto-list').innerHTML = '';
            document.getElementById('fav-auto-list').innerHTML = '';

            const favs = getFavorites();

            window.globalCatalog.forEach(game => {
                const fileName = game.archivo_url;
                const displayName = game.nombre;
                const nameLower = fileName.toLowerCase();
                
                let core = ''; let containerId = '';

                if (nameLower.endsWith('.smc') || nameLower.endsWith('.sfc')) { core = 'snes'; containerId = 'snes-auto-list'; }
                else if (nameLower.endsWith('.md') || nameLower.endsWith('.gen')) { core = 'sega'; containerId = 'md-auto-list'; }
                else if (nameLower.endsWith('.bin')) {
                    if (nameLower.includes('ps1') || nameLower.includes('psx') || nameLower.includes('playstation')) { core = 'psx'; containerId = 'psx-auto-list'; }
                    else { core = 'sega'; containerId = 'md-auto-list'; }
                }
                else if (nameLower.endsWith('.gb') || nameLower.endsWith('.gbc') || nameLower.endsWith('.gba')) { core = 'gba'; containerId = 'gba-auto-list'; }
                else if (nameLower.endsWith('.iso') || nameLower.endsWith('.cue') || nameLower.endsWith('.chd') || nameLower.endsWith('.pbp')) { core = 'psx'; containerId = 'psx-auto-list'; }
                else if (nameLower.endsWith('.nes')) { core = 'nes'; containerId = 'nes-auto-list'; }
                else if (nameLower.endsWith('.nds')) { core = 'nds'; containerId = 'ds-auto-list'; }
                else if (nameLower.endsWith('.n64') || nameLower.endsWith('.v64') || nameLower.endsWith('.z64')) { core = 'n64'; containerId = 'n64-auto-list'; }

                if (core && containerId) {
                    const isFav = favs.includes(fileName);
                    createGameButton(core, fileName, displayName, containerId, isFav);
                    if (isFav) {
                        createGameButton(core, fileName, displayName, 'fav-auto-list', true);
                    }
                }
            });

            if (document.getElementById('fav-auto-list').innerHTML === '') {
                document.getElementById('fav-auto-list').innerHTML = '<p style="color:#888; font-size:14px; text-align:center; padding: 20px;">Aún no tienes favoritos.<br>Usa la estrella (☆) para añadir juegos aquí.</p>';
            }
        }

        async function loadGamesFromCatalog() {
            try {
                const response = await fetch(CATALOG_URL);
                if (!response.ok) {
                    throw new Error(`Error de Cloudflare R2: ${response.status} - ${response.statusText}`);
                }
                window.globalCatalog = await response.json();
                renderAllGames();
            } catch (error) {
                console.error("Error al procesar el catálogo JSON:", error);
                alert(`⚠️ Error detallado al cargar la lista:\n\n${error.message}\n\n👉 Si el error dice "Failed to fetch", significa que te falta configurar el CORS en Cloudflare R2.\n👉 Si el error dice "Unexpected token", significa que el JSON sigue roto o en la caché.`);
            }
        }

        // Llamamos a la nueva función al cargar la página
        loadGamesFromCatalog();

        // =========================================================
        // OPCIÓN 2: CARGAR ROMS LOCALES DESDE EL DISPOSITIVO DEL USUARIO
        // =========================================================
        async function openLocalRoms() {
            if (window.showOpenFilePicker) {
                try {
                    const fileHandles = await window.showOpenFilePicker({
                        id: 'retro-emu-roms-folder', // Identificador para que el navegador recuerde la última carpeta
                        multiple: true,
                        types: [{
                            description: 'ROMs de Juegos',
                            accept: {
                                'application/octet-stream': ['.smc','.sfc','.md','.gen','.bin','.gb','.gbc','.gba','.iso','.cue','.chd','.pbp','.nes','.nds','.n64','.v64','.z64']
                            }
                        }]
                    });
                    const files = [];
                    for (const handle of fileHandles) {
                        files.push(await handle.getFile());
                    }
                    processLocalFiles(files);
                } catch (err) {
                    // Si el usuario cancela no hacemos nada, si es otro error usamos el fallback clásico
                    if (err.name !== 'AbortError') {
                        document.getElementById('rom-upload').click();
                    }
                }
            } else {
                // Fallback para navegadores antiguos, Safari, Firefox o móviles
                document.getElementById('rom-upload').click();
            }
        }

        function loadLocalRoms(event) {
            processLocalFiles(event.target.files);
        }

        function processLocalFiles(files) {
            const listContainer = document.getElementById('local-roms-list');
            listContainer.innerHTML = '';

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const name = file.name.toLowerCase();
                
                let core = '';
                if (name.endsWith('.smc') || name.endsWith('.sfc')) core = 'snes'; // Corregido para que sea 'snes'
                else if (name.endsWith('.md') || name.endsWith('.gen')) core = 'sega';
                else if (name.endsWith('.bin')) {
                    // Si el archivo pesa más de 15MB, es casi seguro un CD de PS1. Si es menos, es cartucho de Mega Drive.
                    if (file.size > 15 * 1024 * 1024) core = 'psx'; else core = 'sega';
                }
                else if (name.endsWith('.gb') || name.endsWith('.gbc') || name.endsWith('.gba')) core = 'gba';
                else if (name.endsWith('.iso') || name.endsWith('.cue') || name.endsWith('.chd') || name.endsWith('.pbp')) core = 'psx';
                else if (name.endsWith('.nes')) core = 'nes';
                else if (name.endsWith('.nds')) core = 'nds';
                else if (name.endsWith('.n64') || name.endsWith('.v64') || name.endsWith('.z64')) core = 'n64';

                if (core) {
                    const btn = document.createElement('button');
                    btn.className = 'game-btn';
                    btn.style.backgroundColor = '#e65100'; // Naranja distinto para diferenciarlos
                    btn.innerText = '🕹️ ' + file.name;
                    // Usamos file.name como identificador estable, de lo contrario createObjectURL cambia en cada carga y borraría el guardado
                    btn.onclick = () => startGame(core, URL.createObjectURL(file), file.name);
                    listContainer.appendChild(btn);
                }
            }
        }

    // =========================================================
    // SISTEMA DE GUARDADO LOCAL (INDEXEDDB) Y SLOTS
    // =========================================================
    const DB_NAME = 'RetroWebEmu_Saves';
    const STORE_NAME = 'savestates';

    function initSaveDB() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_NAME, 1);
            req.onupgradeneeded = (e) => {
                let db = e.target.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) {
                    db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                }
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }

    async function getSlotInfo(gameId) {
        const db = await initSaveDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const store = tx.objectStore(STORE_NAME);
            const req = store.getAll();
            req.onsuccess = () => {
                const results = req.result.filter(r => r.gameId === gameId);
                const info = {};
                results.forEach(r => info[r.slot] = { date: r.date, name: r.name });
                resolve(info);
            };
            req.onerror = () => reject(req.error);
        });
    }

    async function saveStateToSlot(gameId, slot, dataArray, customName = null) {
        const db = await initSaveDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            store.put({
                id: `${gameId}_slot${slot}`,
                gameId: gameId,
                slot: slot,
                name: customName,
                data: dataArray,
                date: new Date().toLocaleString('es-ES')
            });
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
        });
    }

    async function loadStateFromSlot(gameId, slot) {
        const db = await initSaveDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const store = tx.objectStore(STORE_NAME);
            const req = store.get(`${gameId}_slot${slot}`);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }

    window.openSlotMenu = async function(action) {
        document.getElementById('slot-menu-title').innerText = action === 'save' ? 'Guardar en Slot' : 'Cargar de Slot';
        
        const gameId = window.AVS_GAME_ID || 'unknown_game';
        const container = document.getElementById('slot-grid-container');
        container.innerHTML = '<div style="grid-column: 1 / -1;">Cargando slots...</div>';
        document.getElementById('slot-menu-overlay').style.display = 'flex';

        try {
            const info = await getSlotInfo(gameId);
            container.innerHTML = '';
            
            for (let i = 1; i <= 10; i++) {
                const btn = document.createElement('button');
                const hasSave = !!info[i];
                btn.className = `slot-btn ${hasSave ? '' : 'empty'}`;
                
                const title = document.createElement('div');
                title.className = 'slot-btn-title';
                const defaultName = `Slot ${i}`;
                title.innerText = hasSave && info[i].name ? info[i].name : defaultName;
                
                const dateTxt = document.createElement('div');
                dateTxt.className = 'slot-btn-date';
                dateTxt.innerText = hasSave ? info[i].date : 'Vacío';
                if(hasSave && action === 'save') dateTxt.style.color = '#ff9800'; // Aviso de que se va a sobreescribir
                
                btn.appendChild(title);
                btn.appendChild(dateTxt);
                
                btn.onclick = () => handleSlotClick(action, gameId, i);
                container.appendChild(btn);
            }
        } catch (e) {
            container.innerHTML = '<div style="grid-column: 1 / -1;">Error al cargar la base de datos de guardado.</div>';
            console.error(e);
        }
    };

    window.closeSlotMenu = function() {
        document.getElementById('slot-menu-overlay').style.display = 'none';
    };

    async function handleSlotClick(action, gameId, slot) {
        const emu = window.EJS_emulator || (document.querySelector('#game-container iframe')?.contentWindow?.EJS_emulator);
        
        if (!emu || !emu.gameManager) {
            alert("El emulador aún no está listo. Espera un momento o inicia un juego.");
            return;
        }

        if (action === 'save') {
            const customName = prompt(`Ponle un nombre a este guardado (ej: "Antes del jefe") o déjalo así:`, `Slot ${slot}`);
            if (customName === null) return; // El usuario pulsó cancelar

            try {
                const stateData = await emu.gameManager.getState(); // Llama a la API interna del emulador
                await saveStateToSlot(gameId, slot, stateData, customName); // Guarda silenciosamente en el navegador
                alert(`✅ Partida guardada correctamente en: ${customName || `Slot ${slot}`}`);
                closeSlotMenu();
            } catch (e) {
                console.error("Error guardando state:", e);
                alert("❌ Ocurrió un error al intentar guardar la partida.");
            }
        } else if (action === 'load') {
            try {
                const record = await loadStateFromSlot(gameId, slot);
                if (!record) {
                    alert("⚠️ Este slot está vacío. No hay nada que cargar.");
                    return;
                }
                await emu.gameManager.loadState(record.data); // Llama a la API interna del emulador
                alert(`✅ Partida cargada desde el Slot ${slot}`);
                closeSlotMenu();
            } catch (e) {
                console.error("Error cargando state:", e);
                alert("❌ Ocurrió un error al intentar cargar la partida.");
            }
        }
    }

    // =========================================================
    // FUNCIONES DEL NUEVO MENÚ DE OPCIONES
    // =========================================================
    window.openOptionsMenu = function() {
        document.getElementById('options-menu-overlay').style.display = 'flex';
    };

    window.closeOptionsMenu = function() {
        document.getElementById('options-menu-overlay').style.display = 'none';
    };

    window.confirmExit = function() {
        if (confirm("¿Estás seguro de que quieres salir?\nAsegúrate de haber guardado tu partida antes.")) {
            window.location.reload();
        }
    };

    let isMuted = false;
    window.toggleMute = function() {
        const emu = window.EJS_emulator || (document.querySelector('#game-container iframe')?.contentWindow?.EJS_emulator);
        if (!emu || typeof emu.setVolume !== 'function') return;

        isMuted = !isMuted;
        const muteBtn = document.getElementById('mute-btn');
        const volSlider = document.getElementById('volume-slider');
        
        if (isMuted) {
            muteBtn.innerText = '🔇';
            emu.setVolume(0);
        } else {
            muteBtn.innerText = '🔊';
            emu.setVolume(parseFloat(volSlider.value) || 1);
        }
    };

    window.changeVolume = function(val) {
        const emu = window.EJS_emulator || (document.querySelector('#game-container iframe')?.contentWindow?.EJS_emulator);
        if (!emu || typeof emu.setVolume !== 'function') return;
        
        const volume = parseFloat(val);
        emu.setVolume(volume);
        
        const muteBtn = document.getElementById('mute-btn');
        if (volume === 0) {
            muteBtn.innerText = '🔇';
            isMuted = true;
        } else {
            if (isMuted) {
                isMuted = false;
            }
            muteBtn.innerText = '🔊';
        }
    };

    window.simClick = function(el, iframeWin) {
        if(!el) return false;
        
        const fireEvent = (type, constructorName) => {
            try {
                let ev;
                if (constructorName === 'MouseEvent') {
                    ev = new MouseEvent(type, { bubbles: true, cancelable: true, view: iframeWin });
                } else if (constructorName === 'PointerEvent' && typeof PointerEvent !== 'undefined') {
                    ev = new PointerEvent(type, { bubbles: true, cancelable: true, view: iframeWin });
                } else if (constructorName === 'TouchEvent' && typeof TouchEvent !== 'undefined') {
                    ev = new TouchEvent(type, { bubbles: true, cancelable: true });
                } else {
                    ev = new Event(type, { bubbles: true, cancelable: true });
                }
                el.dispatchEvent(ev);
            } catch (e) {}
        };

        fireEvent('pointerdown', 'PointerEvent');
        fireEvent('touchstart', 'TouchEvent');
        fireEvent('pointerup', 'PointerEvent');
        fireEvent('touchend', 'TouchEvent');
        fireEvent('mousedown', 'MouseEvent');
        fireEvent('mouseup', 'MouseEvent');
        fireEvent('click', 'MouseEvent');
        
        try { el.click(); } catch (e) {}
        return true;
    };

    window.clickIframeMenu = function(textToFind) {
        const iframe = document.querySelector('#game-container iframe');
        if (iframe && iframe.contentWindow && iframe.contentWindow.document) {
            const doc = iframe.contentWindow.document;
            const win = iframe.contentWindow;
            const elements = doc.querySelectorAll('*:not(style):not(script)');
            for (const el of elements) {
                if (el.childNodes.length === 1 && el.childNodes[0].nodeType === 3 && el.textContent.trim() === textToFind) {
                    const parentBtn = el.closest('div[role="button"], button, li') || el.parentElement;
                    if (parentBtn) {
                        return window.simClick(parentBtn, win);
                    }
                }
            }
        }
        return false;
    };

    window.restartGameAction = function() {
        if (confirm("¿Estás seguro de que quieres reiniciar el juego? Se perderá el progreso no guardado.")) {
            if (!window.clickIframeMenu('Reiniciar')) {
                const emu = window.EJS_emulator || (document.querySelector('#game-container iframe')?.contentWindow?.EJS_emulator);
                if (emu && emu.gameManager && emu.gameManager.restart) emu.gameManager.restart();
            }
            closeOptionsMenu();
        }
    };

    let isTouchVisible = true;
    window.toggleTouchControls = function() {
        let doc = document;
        const iframe = document.querySelector('#game-container iframe');
        
        if (iframe) {
            try {
                if (iframe.contentWindow && iframe.contentWindow.document) {
                    doc = iframe.contentWindow.document;
                }
            } catch (e) {
                console.warn("No se pudo acceder al documento del iframe:", e);
            }
        } else {
            // Si no hay iframe, verificamos si el contenedor del juego tiene contenido
            const container = document.getElementById('game-container');
            if (!container || container.innerHTML.trim() === '') {
                alert("El juego no está cargado todavía.");
                return;
            }
        }
        
        isTouchVisible = !isTouchVisible;
        
        let style = doc.getElementById('avs-touch-toggle');
        if (!style) {
            style = doc.createElement('style');
            style.id = 'avs-touch-toggle';
            doc.head.appendChild(style);
        }
        
        if (isTouchVisible) {
            style.innerHTML = '';
        } else {
            // Inyectamos CSS agresivo para ocultar los botones táctiles del emulador
            style.innerHTML = `
                div[style*="touch-action: none"], 
                div[style*="touch-action:none"], 
                .virtual-gamepad, 
                #virtual-gamepad, 
                .touch-controls, 
                #touch-controls,
                .emu-gamepad {
                    display: none !important;
                    opacity: 0 !important;
                    pointer-events: none !important;
                }
            `;
        }

        const btn = document.getElementById('btn-touch-toggle');
        if (btn) {
            btn.innerHTML = isTouchVisible ? '📱 Ocultar Mando Táctil' : '📱 Mostrar Mando Táctil';
            btn.style.background = isTouchVisible ? '#607d8b' : '#388e3c';
        }
        closeOptionsMenu();
    };
